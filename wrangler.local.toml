# 내 컴퓨터에서 해 보기 전용 설정 (npm run dev).
# 실제 배포는 Cloudflare 화면에서 GitHub 연결로 하므로 이 파일을 쓰지 않는다.
# (이름이 wrangler.toml 이 아니어야 Cloudflare 화면에서 DB·비밀번호 설정을 바꿀 수 있다)
name = "monthly-schedule"
pages_build_output_dir = "./public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "monthly-schedule"
database_id = "local"
