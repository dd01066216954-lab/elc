<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4층 교육장 현황표</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#24364F">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="4층 교육장">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위쪽 버튼 줄 + 가운데 종이 한 장(신청서 / 현황표 / 부서). 화면 = 인쇄물 */
:root{
  --ground:#ECEEF1; --paper:#FFFFFF; --ink:#1D1F23; --muted:#5D636B;
  --line:#8A8F96; --line-strong:#3F444B; --head:#F3F4F6;
  --navy:#24364F; --navy-soft:#E3E8EF; --red:#C62828;
  --font:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[contenteditable]:focus{outline:2px solid #2F6FD0;outline-offset:1px}

/* 위쪽 버튼 줄 */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid #D4D7DC;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 24px;min-height:64px}
.room{font-size:17px;font-weight:700}
.who{display:flex;align-items:center;gap:6px;font-size:14px;background:var(--head);border-radius:16px;padding:4px 6px 4px 12px}
.who b{font-weight:700}
.who.admin{background:#FFF1D6}
.link{border:0;background:transparent;color:#2F5C99;font-size:13px;text-decoration:underline;padding:4px 6px}
.nav{display:flex;align-items:center}
.nav button{width:44px;height:44px;border:0;background:transparent;font-size:16px;color:#333;border-radius:8px}
.nav button:hover{background:var(--head)}
.nav{position:relative}
.nav .ym{width:auto;min-width:120px;padding:0 10px;font-size:17px;font-weight:500;color:var(--ink)}
.nav .ym::after{content:' ▾';font-size:12px;color:var(--muted)}
.mpick{position:absolute;top:48px;left:50%;transform:translateX(-50%);z-index:30;background:var(--paper);border:1px solid #C5CAD2;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:12px;width:260px}
.mp-y{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mp-y b{font-size:17px}
.mpick .mp-y button{width:40px;height:36px}
.mp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mpick .mp-g button{width:auto;height:40px;border:1px solid #D4D7DC;border-radius:8px;background:#fff;font-size:15px}
.mpick .mp-g button.now{border-color:#2F6FD0;color:#2F6FD0;font-weight:700}
.mpick .mp-g button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.mpick .mp-today{display:block;width:100%;height:38px;margin-top:10px;padding:0;border:1px solid #C5CAD2;border-radius:8px;background:#F4F6F9;color:var(--navy);font-size:14.5px;font-weight:700;text-decoration:none;white-space:nowrap}
.mpick .mp-today:hover{background:var(--navy-soft)}
.seg{display:flex;border:1px solid #B9BEC6;border-radius:8px;overflow:hidden}
.seg button{height:42px;padding:0 20px;border:0;background:var(--paper);color:#444;font-size:15px}
.seg button+button{border-left:1px solid #D4D7DC}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.grow{flex:1}
.pend{height:36px;padding:0 14px;border-radius:18px;border:1.5px dashed #767676;background:var(--paper);color:#333;font-size:14px;font-weight:700}
.btn{height:44px;padding:0 20px;border-radius:8px;border:1px solid #B9BEC6;background:var(--paper);color:var(--ink);font-size:15px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.btn.done{background:var(--navy-soft);border-color:var(--navy-soft);color:var(--navy);font-weight:700}
.btn.danger{border-color:#D9A3A3;color:#A11F1F}
.btn.danger.solid{background:#B3261E;border-color:#B3261E;color:#fff;font-weight:700}

/* 확인 줄 */
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:#FFF8E1;border-bottom:1px solid #E8D9A8;padding:10px 24px;font-size:14.5px}
.ask input{height:38px;width:150px;padding:0 10px;border:1px solid #B9BEC6;border-radius:6px;font-size:15px;font-family:inherit}
.ask .btn{height:38px}
.ask .err{color:var(--red);font-weight:700}
/* 지우기 확인: 누른 버튼 옆에 작은 상자로 */
.ask.pop{position:absolute;z-index:40;width:max-content;max-width:340px;border:1px solid #E0CC8A;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:12px 14px}
.ask.pop #askMsg{flex-basis:100%}
.ask.pop{justify-content:flex-end}
.ask.pop .btn{height:34px}
.ask.pop input{width:130px;height:36px}
.ask.pop::after{content:'';position:absolute;width:12px;height:12px;background:#FFF8E1;border:1px solid #E0CC8A;transform:rotate(45deg)}
.ask.pop.side::after{right:-7px;top:calc(50% - 6px);border-left:0;border-bottom:0}
.ask.pop.below::after{top:-7px;left:var(--ax,20px);border-right:0;border-bottom:0}

/* 종이 */
main{padding:24px 16px 48px}
.sheet{width:1000px;max-width:100%;margin:0 auto;background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.12);padding:26px 26px 30px;overflow-x:auto}
.title{text-align:center;font-size:25px;font-weight:700;letter-spacing:-.4px;margin:0 0 16px;text-wrap:balance}
.title em{font-style:normal;color:var(--red)}
.notice{display:flex;align-items:center;gap:10px;justify-content:center;font-size:13.5px;color:var(--muted);margin:-6px 0 14px}
.notice button{border:0;background:var(--head);border-radius:6px;height:28px;padding:0 10px;font-size:13px;color:#444}

/* 부서 고르기 */
.chooser{max-width:min(560px,100%);text-align:center;padding:40px 28px}
.chooser p{color:var(--muted);margin:0 0 22px;font-size:15px}
.depts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.depts button{height:64px;border-radius:10px;font-size:17px;font-weight:700;color:var(--ink)}
.chooser .link{margin-top:26px;font-size:14px}
@media (max-width: 720px){
  .chooser{padding:28px 14px}
  .depts{grid-template-columns:1fr;gap:10px}   /* 휴대폰: 한 줄에 하나씩 */
  .depts button{height:56px;font-size:17px;padding:0 6px}
  .chooser .admin-in{display:block;width:100%;height:48px;margin-top:22px;border:1px solid #C5CAD2;border-radius:10px;background:#fff;color:var(--ink);font-size:15px;font-weight:700;text-decoration:none}
}

/* 현황표 */
.cal{min-width:900px;border:1.5px solid var(--line-strong)}
.cal-head,.wk{display:grid;grid-template-columns:48px 56px repeat(5,minmax(0,1fr))}
.cal-head>div{height:34px;display:flex;align-items:center;justify-content:center;background:var(--head);font-weight:700;font-size:16px;border-right:1px solid var(--line);border-bottom:1.5px solid var(--line-strong)}
.cal-head>div:last-child{border-right:0}
.wk{border-bottom:1.5px solid var(--line-strong)}
.wk:last-child{border-bottom:0}
.wk>div{border-right:1px solid var(--line)}
.wk>.c5{border-right:0}
.wlabel{grid-row:1/4;grid-column:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.lab{grid-column:2;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
.lab.r1,.date{background:var(--head);height:32px;border-bottom:1px solid var(--line)}
.lab.r2{border-bottom:1px solid var(--line)}
.date{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.date.red{color:var(--red)}
.half{padding:0;display:flex;flex-direction:column;position:relative;cursor:text}
.half.am{min-height:92px}
/* 칸 테두리는 일정 네모 위에 그린다 (색칠한 칸끼리 붙어도, 줄여 인쇄해도 줄이 사라지지 않게) */
.wk>.half{border-right:0}
.half::before{content:'';position:absolute;inset:0;border-right:1px solid var(--line);pointer-events:none;z-index:3}
.half.am::before{border-bottom:1px solid var(--line)}
.half.c5::before{border-right:0}
.half.pm{min-height:150px}
.half.full{min-height:243px}
.half.out{background:#F7F7F8;cursor:default}
.half:not(.out):not(.hol):hover::after{content:'+ 적기';position:absolute;right:6px;bottom:3px;font-size:11px;color:#9AA0A8;pointer-events:none}
.half.hol{display:flex;align-items:center;justify-content:center;color:var(--red);font-size:26px;font-weight:700;cursor:default;text-align:center;line-height:1.25;word-break:keep-all}
.half.hol small{font-size:.8em}

.blk{padding:4px 6px;border-radius:4px;text-align:center;line-height:1.32;font-size:12px;color:var(--ink);white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.blk.ed::first-line{font-weight:700;font-size:12.5px}
.blk.lock{cursor:default}
.blk.ov{outline:2px solid var(--red);outline-offset:-2px}
.blk.pd{background:#fff!important;border:1.5px dashed #767676!important;color:#4A4A4A;white-space:normal}
.blk.pd .t1{font-weight:700}
.blk .tag{font-size:10.5px;font-weight:700;color:#555}
.blk.strike .t1,.blk.strike .t2{text-decoration:line-through}
.blk.newblk{background:#fff;border:1.5px solid #2F6FD0;min-height:52px}
.blk.newblk:empty::before{content:attr(data-ph);color:#9AA0A8;white-space:pre}
/* 칸 채우기: 일정 네모가 칸을 꽉 채우고, 여러 개면 칸을 나눠 가진다 (가운데 줄로 구분) */
.half>.blk,.half>.bwrap{flex:1 1 auto}
.half>.blk.ed,.half>.bwrap>.blk.ed{border:0;border-radius:0}
.half .blk{align-content:center;padding:6px}
.half>.bwrap{display:flex;flex-direction:column}
.half>.bwrap>.blk{flex:1 1 auto}
.half>:is(.blk,.bwrap)~:is(.blk,.bwrap){border-top:1px solid #C5C9CF}
.half .blk.pd,.half .blk.newblk{border-radius:0}
.half .ovnote{margin:0;padding:2px 0}
#main .half:not(.out):not(.hol){padding-bottom:18px}
.ovd[data-mgr]{position:relative;cursor:help;text-decoration:underline dotted;text-underline-offset:2px}
.ovd[data-mgr]:hover::after,.ovd[data-mgr]:focus::after{content:attr(data-mgr);position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);
  background:#fff;color:var(--ink);font-size:12px;font-weight:500;white-space:nowrap;border:1px solid #C5CAD2;border-radius:6px;padding:3px 8px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:50}
.ovnote{font-size:11px;font-weight:700;color:#B71C1C;text-align:center;margin-top:-2px}
.acts{display:flex;justify-content:center;gap:6px;margin-top:4px}
.acts button{height:28px;padding:0 12px;border-radius:5px;font-size:12px}
.acts .ok{border:0;background:var(--navy);color:#fff;font-weight:700}
.acts .no{border:1px solid #9A9A9A;background:#fff;color:#333}
.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 4px #FFD54F}}
/* 휴대폰 */
@media (max-width: 720px), (max-height: 520px) and (pointer: coarse){
  .bar{padding:6px 8px;gap:4px 6px;min-height:0}
  .room{font-size:15px}
  .bar .btn[data-act="print"]{display:none}
  .nav button{width:36px;height:40px}
  .nav .ym{min-width:0;font-size:16px;padding:0 4px}
  .seg button{height:38px;padding:0 10px;font-size:14px}
  .bar .grow{display:none}
  #main{padding:6px 0 20px}
  .sheet{padding:16px 12px 20px;box-shadow:none}
  .sheet .title{font-size:19px;margin-bottom:12px}
  .sheet[data-view="form"]::before{content:'← 옆으로 밀어서 보세요 · 신청서는 컴퓨터에서 적기 편해요';display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .ask{padding:8px 12px}
  .ask.pop{max-width:calc(100vw - 24px)}
  .mpick{position:fixed;top:56px;left:50%;transform:translateX(-50%)}
}
.phone.sheet{padding-left:6px;padding-right:6px}
.wknav{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.wknav b{font-size:16px}
.wknav b span{font-weight:500;color:var(--muted);font-size:14px}
.wknav button{width:48px;height:40px;border:1px solid #C5CAD2;border-radius:8px;background:#fff;font-size:15px}
.phone .cal{min-width:0}
.phone .cal-head,.phone .wk{grid-template-columns:0 22px repeat(5,minmax(0,1fr))}
.phone .cal-head>div:first-child,.phone .wlabel{overflow:hidden;font-size:0;border:0;padding:0}   /* 칸 자리는 남겨 둠 (없애면 요일이 한 칸씩 밀림) */
.phone .cal-head>div{font-size:14px;height:30px}
.phone .cal-head>div:nth-child(2){font-size:0!important}
.phone .lab{font-size:11.5px;writing-mode:vertical-rl;letter-spacing:2px}
.phone .lab.r1{writing-mode:horizontal-tb;letter-spacing:0;font-size:0}
.phone .date{font-size:15px;height:28px}
.phone .half.am,.phone .half.pm{min-height:52px}.phone .half.full{min-height:104px}
.phone > .title{font-size:18px;margin:0 0 6px}
.phone.sheet{padding-top:8px;padding-bottom:10px}
.phone .half .blk{font-size:10px;line-height:1.25;padding:4px 1px;letter-spacing:-.3px}
.phone .blk.ed::first-line{font-size:10px}
.phone .half.hol{font-size:15px}
.phone .ovnote{font-size:9.5px}
.phone .half:hover::after{content:none!important}
#main .phone .half:not(.out):not(.hol){padding-bottom:4px}
.phone .notice{font-size:13px}
@media (max-width: 720px){ .bar .room{display:none} .who{padding-left:8px} }
@media (prefers-reduced-motion:reduce){.flash{animation:none;box-shadow:0 0 0 4px #FFD54F}}

/* 신청서 */
.rules{display:grid;grid-template-columns:150px 1fr;border:1.5px solid var(--line-strong);margin-bottom:14px}
.rules .rh{background:#D9DCE1;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;letter-spacing:2px}
.rules .rb{padding:10px 14px;line-height:1.7;white-space:pre-line;font-size:14px}
/* 신청 기간 */
.period{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:-4px 0 14px;font-size:14px}
.period b{font-weight:700}
.period input{height:34px;border:1px solid #B9BEC6;border-radius:6px;padding:0 8px;font-size:14px;font-family:inherit}
.period .pstate{font-size:13px;color:var(--muted)}
.period .pstate.open{color:#1E6B3A;font-weight:700}
.period .pstate.shut{color:#A11F1F;font-weight:700}
.period .mchip{padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700}
table.form{width:100%;min-width:820px;border-collapse:collapse;table-layout:fixed;border:1.5px solid var(--line-strong)}
.form th{background:var(--head);font-size:14.5px;font-weight:700;height:38px;border:1px solid var(--line);letter-spacing:1px}
.form td{border:1px solid var(--line);padding:0;vertical-align:top}
.form td.no{text-align:center;vertical-align:middle;font-weight:700;font-variant-numeric:tabular-nums}
.form input{width:100%;height:38px;border:0;padding:0 8px;font-size:14px;font-family:inherit;background:transparent;color:var(--ink)}
.form input::placeholder{color:#B4B8BE}
.form td.deptcell{vertical-align:middle;padding:0 8px;font-weight:700}
.hint{font-size:11.5px;color:var(--muted);padding:0 8px 6px;line-height:1.4}
.hint.info{display:none}
.form td:focus-within .hint.info{display:block}
.hint.daynote{color:#3F444B;margin-top:-2px}
.hint.bad{color:#B71C1C;font-weight:700}
.form tr.pdrow td{background:#FAFAFA}
.form tr.pdrow td:first-child{border-left:3px dashed #767676}
.form tr.delrow input{text-decoration:line-through;color:#888}
.form .etc{padding:4px 6px}
.form .etc input{height:30px;padding:0 2px}
.form .etc .tag{font-size:11.5px;font-weight:700;color:#555}
.form .etc .acts{justify-content:flex-start}
.form tr.grp td{background:#F7F8FA;height:6px;padding:0}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:12px}

/* 이용시간 빠른 선택 */
.tchips{display:none;flex-wrap:wrap;gap:4px;padding:0 6px 6px}
.form td:focus-within .tchips{display:flex}
.tchips button{height:26px;padding:0 8px;border-radius:13px;border:1px solid #C5CAD2;background:#F4F6F9;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.tchips button:hover{background:#E3E8EF}

/* 부서 버튼 */
.dchips button{border-width:1px;font-weight:700;color:var(--ink)}
.nbchips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.nbchips button{height:24px;padding:0 6px;border-radius:12px;font-size:11px;font-weight:700;color:var(--ink);cursor:pointer}

/* 이용시간 고르기 */
.tpick{display:flex;flex-direction:column;gap:8px}
.tp-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.tp-line>b{width:40px;font-size:14px}
.tp-ap{font-size:11.5px;color:var(--muted);margin:0 2px 0 6px}
.tp-gap{width:14px}
.tp-b{height:36px;min-width:38px;padding:0 5px;border-radius:8px;border:1px solid #C5CAD2;background:#fff;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.tp-b:hover{background:#EEF3FB}
.tp-b.tp-m{min-width:40px;background:#F4F6F9}
.tp-b.on{background:#2F6FD0;border-color:#2F6FD0;color:#fff;font-weight:700}
.tp-quick .tp-b{border-radius:18px;background:#F4F6F9}
.tp-busy{position:relative;margin:2px 0 0 64px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;border-top:1px solid #C5CAD2;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/11.5 - 1px),#E3E6EA calc(100%/11.5 - 1px) calc(100%/11.5))}
.tp-tick{position:absolute;top:1px;font-size:10.5px;color:var(--muted);transform:translateX(-50%)}
.tp-tick:first-child{transform:none}
.tp-seg{position:absolute;height:20px;border-radius:3px;font-size:11px;font-weight:700;line-height:18px;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:default}
.tp-mine{position:absolute;background:rgba(47,111,208,.16);border:2px solid #2F6FD0;border-radius:4px;z-index:2;cursor:grab;display:flex;align-items:center;justify-content:center;min-width:6px}
.tp-mine.drag{cursor:grabbing;box-shadow:0 2px 10px rgba(47,111,208,.35)}
.tp-mine.bad{border-color:var(--red);background:rgba(198,40,40,.14)}
.tp-mine.bad .tp-lab{color:var(--red)}
.tp-lab{font-size:11.5px;font-weight:700;color:#1F4F9A;white-space:nowrap;background:rgba(255,255,255,.85);border-radius:3px;padding:0 3px;pointer-events:none}
.tp-h{position:absolute;top:0;bottom:0;width:12px;cursor:ew-resize}
.tp-h.l{left:-7px}.tp-h.r{right:-7px}
.tp-h::after{content:'';position:absolute;top:calc(50% - 8px);left:4px;width:4px;height:16px;border-radius:2px;background:#2F6FD0}
.tp-mine.bad .tp-h::after{background:var(--red)}
.tp-tick,.tp-free{pointer-events:none}
.tp-free.none{color:var(--muted)}
.tp-day{position:absolute;left:-64px;right:0;border-top:1px solid #E3E6EA;font-size:11.5px;color:#9AA0A8;line-height:22px;padding-left:2px;pointer-events:none}
.tp-day.on{color:var(--ink);font-weight:700}
.tp-day.all{color:#1F4F9A;font-weight:700;line-height:26px;background:rgba(47,111,208,.05);border-bottom:1px solid #C5CAD2}
.tp-mine.pend{border-style:dashed}
.tp-how{margin:2px 0 0 64px;font-size:12px;color:var(--muted)}
.tp-free{position:absolute;top:20px;left:0;font-size:12px;color:#1E6B3A}

<script>
'use strict';
/* ---------------- 공휴일 기본 목록 (2026~2028). 서버가 특일 정보 API 에서 받은 달은 그것으로 바꿈 ---------------- */
var HOL = {
  '2026-01-01':'신정','2026-02-16':'설날','2026-02-17':'설날','2026-02-18':'설날',
  '2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-05':'어린이날',
  '2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-03':'지방선거일',
  '2026-06-06':'현충일','2026-07-17':'제헌절','2026-08-15':'광복절','2026-08-17':'대체공휴일',
  '2026-09-24':'추석','2026-09-25':'추석','2026-09-26':'추석','2026-09-28':'대체공휴일',
  '2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절',
  '2027-01-01':'신정','2027-02-06':'설날','2027-02-07':'설날','2027-02-08':'설날','2027-02-09':'대체공휴일',
  '2027-03-01':'삼일절','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일',
  '2027-07-17':'제헌절','2027-08-15':'광복절','2027-08-16':'대체공휴일',
  '2027-09-14':'추석','2027-09-15':'추석','2027-09-16':'추석',
  '2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일',
  '2027-12-25':'성탄절','2027-12-27':'대체공휴일',
  '2028-01-01':'신정','2028-01-25':'설날','2028-01-26':'설날','2028-01-27':'설날',
  '2028-03-01':'삼일절','2028-04-12':'국회의원선거일','2028-05-02':'부처님오신날','2028-05-05':'어린이날',
  '2028-06-06':'현충일','2028-07-17':'제헌절','2028-08-15':'광복절',
  '2028-10-02':'추석','2028-10-03':'개천절 · 추석','2028-10-04':'추석','2028-10-05':'대체공휴일',
  '2028-10-09':'한글날','2028-12-25':'성탄절'
};

/* ---------------- 저장: 서버(/api)에 줄 단위로 ---------------- */
/* 화면 쪽 로직은 시안 그대로 DB 를 고치고, save() 가 서버에 맞춰 둔 모습(snap)과 비교해 바뀐 줄만 보낸다. */
var PREF = 'edu-room-4f-prefs';   // 이 기기에서만 기억: 고른 부서와 그 부서 토큰, 보던 달·보기
var DB = {depts:[], rules:'', adminSet:false, me:null, months:{}, times:[], today:null}, admin = false, view = 'cal', cur;
var deptToken = null, adminToken = null;   // 관리자 토큰은 이 창에서만 (새로 열면 다시 비밀번호)
var snap = {ym:null};
function loadPrefs(){
  var p = {}; try { p = JSON.parse(localStorage.getItem(PREF) || '{}') || {}; } catch(e) {}
  var now = new Date();
  cur = /^\d{4}-\d{2}$/.test(p.cur) ? p.cur : now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  view = p.view === 'form' ? 'form' : 'cal';
  DB.me = p.me && p.tok ? p.me : null;
  deptToken = DB.me ? p.tok : null;
}
function savePrefs(){
  try { localStorage.setItem(PREF, JSON.stringify({cur:cur, view: view === 'dept' ? 'cal' : view, me:DB.me, tok: DB.me ? deptToken : null})); } catch(e) {}
}
function save(){ savePrefs(); sync(); }
function api(method, path, body){
  var h = body ? {'Content-Type':'application/json'} : {}, tok = admin ? adminToken : deptToken;
  if (tok && path !== '/login') h.Authorization = 'Bearer ' + tok;
  return fetch('/api' + path, {method:method, headers:h, body: body ? JSON.stringify(body) : undefined})
    .then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        if (!res.ok) { var e = new Error(data.error || '저장하지 못했어요.'); e.status = res.status; e.login = !!data.login; throw e; }
        if (data.fixed) needReload = true;   // 서버가 승인 대기로 바꿔 저장함 → 다시 불러오기
        return data;
      });
    }, function(){ throw new Error('인터넷 연결을 확인해 주세요.'); });
}
function setMonth(data){
  DB.depts = data.depts; DB.rules = data.rules; DB.adminSet = data.adminSet; DB.times = data.times; DB.today = data.today;
  if (data.holidays && Object.keys(data.holidays).length) {   // 공휴일 API 에서 받은 것으로 그 달을 바꿈 (못 받았거나 비었으면 위 기본 목록 그대로)
    Object.keys(HOL).forEach(function(k){ if (k.indexOf(data.ym + '-') === 0) delete HOL[k]; });
    Object.keys(data.holidays).forEach(function(k){ HOL[k] = data.holidays[k]; });
    dCache = {};
  }
  DB.months[data.ym] = {confirmed:data.confirmed, imported:data.imported, rows:data.rows, ops:data.ops, period:data.period};
  if (DB.me && !deptOf(DB.me)) { DB.me = null; savePrefs(); }
  if (data.ym === cur) markSynced();
}
function loadMonth(k){ return api('GET', '/month?ym=' + k).then(function(d){ lastSig = JSON.stringify(d); setMonth(d); }); }
/* 여러 사람이 동시에: 1분마다, 그리고 창으로 돌아올 때 그 달을 다시 불러온다.
   적는 중(입력 칸·현황표 칸), 달력·시간 고르기, 노란 줄, 저장 중일 때는 건드리지 않는다. */
var lastSig = '';
function idle(){
  var ae = document.activeElement;
  if (pending || !document.getElementById('ask').hidden || openPick || openTime || document.querySelector('.newblk')) return false;
  return !(ae && ae !== document.body && (ae.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)));
}
function refresh(){
  if (!M() || document.hidden || !idle()) return;
  var k = cur;
  api('GET', '/month?ym=' + k).then(function(d){
    var sig = JSON.stringify(d);
    if (k !== cur || !idle() || sig === lastSig) return;
    lastSig = sig; setMonth(d); render();
  }, function(){});
}
setInterval(refresh, 60000);
window.addEventListener('focus', refresh);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(); });
function markSynced(){
  var mo = M(), ids = function(list){ var o = {}; list.forEach(function(x){ o[x.id] = JSON.stringify(x); }); return o; };
  snap = {ym:cur, rows:ids(mo.rows), ops:ids(mo.ops), imported:!!mo.imported, rules:DB.rules};
}
var queue = Promise.resolve();
function sync(){
  if (!M() || snap.ym !== cur) return;
  var k = cur, mo = M(), jobs = [];
  var diff = function(list, prev, path, key){
    var now = {};
    list.forEach(function(x){
      var s = JSON.stringify(x), b = {}; now[x.id] = s; b[key] = x;
      if (!(x.id in prev)) { b.ym = k; jobs.push(['POST', path, b]); }
      else if (prev[x.id] !== s) jobs.push(['PUT', path + '/' + x.id, b]);
    });
    Object.keys(prev).forEach(function(id){ if (!(id in now)) jobs.push(['DELETE', path + '/' + id]); });
  };
  diff(mo.rows, snap.rows, '/rows', 'row');
  diff(mo.ops, snap.ops, '/ops', 'op');
  if (snap.imported && !mo.imported) jobs.push(['POST', '/month/notice', {ym:k}]);
  if (DB.rules !== snap.rules) jobs.push(['PUT', '/settings', {rules:DB.rules}]);
  markSynced();
  jobs.forEach(function(j){ send(function(){ return api(j[0], j[1], j[2]); }); });
}
/* 순서대로 보내고, 하나라도 안 되면 서버 내용으로 다시 불러온다 */
var needReload = false, pending = 0;
function send(fn, after){
  pending++;
  queue = queue.then(fn).then(after || null).catch(saveFailed).then(function(){
    if (--pending === 0 && needReload) { needReload = false; loadMonth(cur).then(render, function(){}); }
  });
  return queue;
}
var failing = false;
function saveFailed(e){
  if (e && e.login) return loggedOut();
  if (failing) return; failing = true;
  setTimeout(function(){ failing = false; }, 1500);
  loadMonth(cur).then(render, function(){});
  ask({text: '저장하지 못했어요. ' + (e && e.message ? e.message : '') + ' 서버에 있는 내용으로 다시 불러왔어요.', okLabel:'확인', onOk:function(){}});
}
/* 토큰이 끝났거나 비밀번호가 바뀜 → 다시 들어오게 */
function loggedOut(){
  var wasAdmin = admin;
  if (admin) { admin = false; adminToken = null; if (view === 'dept') view = 'cal'; }
  else { DB.me = null; deptToken = null; }
  savePrefs();
  loadMonth(cur).then(render, function(){ render(); });
  setTimeout(function(){
    if (wasAdmin) ask({text: '관리자로 들어온 지 오래되어 다시 비밀번호가 필요해요. 방금 고친 것은 저장되지 않았어요.', pin:true, okLabel:'들어가기',
      check: adminCheck(false), onOk:function(){ admin = true; }});
    else ask({text: '부서 비밀번호가 바뀌어서 다시 들어와야 해요. 부서를 골라 주세요.', okLabel:'확인', onOk:function(){}});
  }, 50);
}
/* 서버가 처리하고 그 달을 통째로 돌려주는 요청 (승인, 확정, 전부 지우기) */
function sendMonth(path, body){ send(function(){ return api('POST', path, body); }, function(d){ setMonth(d); render(); }); }
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); };

/* ---------------- 날짜 도우미 ---------------- */
var pad = function(n){ return String(n).padStart(2,'0'); };
function ym(){ var p = cur.split('-'); return {y:+p[0], m:+p[1]}; }
function dim(){ var t = ym(); return new Date(t.y, t.m, 0).getDate(); }
function dow(d){ var t = ym(); return new Date(t.y, t.m-1, d).getDay(); }
function holName(d){ return HOL[cur + '-' + pad(d)] || null; }
function shiftMonth(k, n){ var p = k.split('-'), dt = new Date(+p[0], +p[1]-1+n, 1); return dt.getFullYear() + '-' + pad(dt.getMonth()+1); }
function M(){ return DB.months[cur]; }

/* ---------------- 해석: 시간 ---------------- */
function parseTime(str){
  if (!str) return null;
  var s = String(str).replace(/\s+/g,' ');
  var pm = /오후/.test(s);
  /* 1시반 → 1:30, 1330 → 13:30, '부터/까지', 띄어쓰기만 한 '1330 1500' 도 알아듣기 */
  s = s.replace(/(\d{1,2})\s*시\s*반/g, '$1:30').replace(/\s*(부터|에서)\s*/g, '~').replace(/까지/g, '');
  s = s.replace(/(^|[^\d:.])(\d{1,2})(\d{2})(?![\d:.])/g, '$1$2:$3');
  s = s.replace(/(\d{1,2})\s*시\s*(\d{1,2})\s*분?/g, '$1:$2').replace(/(\d{1,2})\s*시/g, '$1:00');
  if (!/[~∼\-–]/.test(s)) s = s.replace(/(\d)\s+(?=\d)/, '$1~');
  var m = s.match(/(\d{1,2})(?:\s*[:.]\s*(\d{2}))?\s*[~∼\-–]\s*(\d{1,2})(?:\s*[:.]\s*(\d{2}))?/);
  if (!m) return null;
  var h1 = +m[1], m1 = +(m[2]||0), h2 = +m[3], m2 = +(m[4]||0);
  if (h1 > 23 || h2 > 24 || m1 > 59 || m2 > 59) return null;
  if (pm && h1 < 12) h1 += 12;
  else if (h1 < 8) h1 += 12;
  if (h2 < 8 || (h2 < 12 && h2*60+m2 <= h1*60+m1)) h2 += 12;
  var a = h1*60+m1, b = h2*60+m2;
  if (b <= a) return null;
  return {s:a, e:b, label: pad(h1)+':'+pad(m1)+'~'+pad(h2)+':'+pad(m2)};
}

/* ---------------- 이용날짜: 요일(매주) + 콕 찍은 날 - 뺀 날 ---------------- */
var WDN = ['','월','화','수','목','금'];
var dCache = {};
function emptySel(){ return {wd:[], add:[], off:[]}; }
function selDays(sel){
  sel = sel || emptySel();
  var ck = cur + '|' + JSON.stringify(sel);
  if (dCache[ck]) return dCache[ck];
  var n = dim(), days = [];
  for (var d = 1; d <= n; d++) {
    var w = dow(d);
    if (w === 0 || w === 6 || holName(d)) continue;
    if ((sel.wd.indexOf(w) >= 0 && sel.off.indexOf(d) < 0) || sel.add.indexOf(d) >= 0) days.push(d);
  }
  return dCache[ck] = days;
}
function isOn(sel, d){ return selDays(sel).indexOf(d) >= 0; }
function wdText(wd){
  var w = wd.slice().sort(), out = [], i = 0;
  while (i < w.length) {
    var j = i; while (j+1 < w.length && w[j+1] === w[j]+1) j++;
    if (j - i >= 2) out.push(WDN[w[i]]+'~'+WDN[w[j]]); else for (var k = i; k <= j; k++) out.push(WDN[w[k]]);
    i = j + 1;
  }
  return out.join(', ');
}
function selText(sel){
  if (!sel) return '';
  var parts = [], num = function(a,b){ return a-b; };
  if (sel.wd.length) {
    var offs = sel.off.filter(function(d){ return sel.wd.indexOf(dow(d)) >= 0 && !holName(d); }).sort(num);
    parts.push('매주 '+wdText(sel.wd)+(offs.length ? ' ('+offs.join(', ')+'일 빠짐)' : ''));
  }
  if (sel.add.length) parts.push(sel.add.slice().sort(num).join(', ')+'일');
  return parts.join(' + ');
}
function selEmpty(sel){ return !sel || (!sel.wd.length && !sel.add.length); }
function toggleWd(sel, w){
  var i = sel.wd.indexOf(w);
  if (i >= 0) sel.wd.splice(i,1); else sel.wd.push(w);
  sel.off = sel.off.filter(function(d){ return dow(d) !== w; });
  sel.add = sel.add.filter(function(d){ return dow(d) !== w || i >= 0; });
}
function toggleDay(sel, d){
  var inWd = sel.wd.indexOf(dow(d)) >= 0;
  if (sel.add.indexOf(d) >= 0) sel.add.splice(sel.add.indexOf(d),1);
  else if (inWd) { var k = sel.off.indexOf(d); if (k >= 0) sel.off.splice(k,1); else sel.off.push(d); }
  else sel.add.push(d);
}

/* ---------------- 부서 ---------------- */
var CLS = ['c0','c1','c2','c3','c4','c5c','c6','c7','c8'];
function deptOf(name){ return DB.depts.find(function(x){ return x.name === name; }); }
function colorOf(name){
  var d = deptOf((name||'').trim());
  if (d) return CLS[d.ci % CLS.length];

function itemsFor(d, mode){
  var mo = M(), res = [];
  mo.rows.forEach(function(row){
    var f = row, pk = row.pend ? row.pend.kind : null;
    if (mode === 'print') { if (pk === 'new') return; if (pk) f = row.pend.prev; }
    if (selDays(f.sel).indexOf(d) < 0) return;
    var rem = null;
    mo.ops.forEach(function(o){ if (o.type === 'remove' && o.rowId === row.id && o.d === d) rem = o; });
    var pend = mode === 'screen' ? pk : null, src = 'row', id = row.id;
    if (rem) {
      if (!rem.pend) return;
      if (mode === 'screen') { pend = 'remove'; src = 'op'; id = rem.id; }
    }
    var t = parseTime(f.time);
    res.push({src:src, id:id, rowId:row.id, dept:f.dept, prog:f.prog, note:f.note||'', time:t ? t.label : (f.time||''),
              s:t ? t.s : null, e:t ? t.e : null, pend:pend, half:null, yieldOk:!!f.yieldOk});
  });
  mo.ops.forEach(function(o){
    if (o.type !== 'add' || o.d !== d) return;
    var b = o.blk, pk = o.pend ? o.pend.kind : null;
    if (mode === 'print') { if (pk === 'new') return; if (pk) b = o.pend.prev; }
    var t = parseTime(b.time);
    res.push({src:'op', id:o.id, rowId:b.rowId||null, dept:b.dept, prog:b.prog, note:b.note||'', time:t ? t.label : (b.time||''),
              s:t ? t.s : null, e:t ? t.e : null, pend: mode === 'screen' ? pk : null, half:b.half||'am'});
  });
  /* 겹치면 양보: 다른 일정 시간만큼 잘라 내고, 30분보다 짧게 남은 조각은 버림 */
  var gone = function(x){ return x.pend === 'remove' || x.pend === 'del' || x.pend === 'new'; };
  var fixed = res.filter(function(x){ return !x.yieldOk && x.s != null && !gone(x); });
  var out = [];
  res.forEach(function(x){
    if (!x.yieldOk || x.s == null || x.pend === 'remove' || x.pend === 'del') { out.push(x); return; }
    var segs = [[x.s, x.e]], by = [];
    fixed.forEach(function(o){
      var ns = [];
      segs.forEach(function(g){
        if (o.s < g[1] && g[0] < o.e) { by.push(o.prog || o.dept); if (g[0] < o.s) ns.push([g[0], o.s]); if (o.e < g[1]) ns.push([o.e, g[1]]); }
        else ns.push(g);
      });
      segs = ns;
    });
    if (!by.length) { out.push(x); return; }
    segs.filter(function(g){ return g[1] - g[0] >= 30; }).forEach(function(g, i){
      out.push(Object.assign({}, x, {s:g[0], e:g[1], time:hm(g[0])+'~'+hm(g[1]), adj:uniq(by), seg:i}));
    });
  });
  res = out;
  res.forEach(function(x){ x.k = x.s != null ? x.s : (x.half === 'pm' ? 720 : 0); x.ovWith = []; });
  res.sort(function(a,b){ return a.k - b.k; });
  var act = res.filter(function(x){ return x.pend !== 'remove' && x.pend !== 'del' && x.s != null; });
  for (var i = 0; i < act.length; i++) for (var j = i+1; j < act.length; j++) {
    var a = act[i], b = act[j];
    if (a.s < b.e && b.s < a.e) { a.ovWith.push(b.dept||'이름 없음'); b.ovWith.push(a.dept||'이름 없음'); }
  }
  return res;
}

function tpPos(m){ return Math.max(0, Math.min(100, (m - TP_A) / (TP_B - TP_A) * 100)); }
function mineHTML(a, b, bad, o){

    ' style="left:'+tpPos(a)+'%;width:'+(tpPos(b)-tpPos(a))+'%;top:'+o.top+'px;height:'+o.h+'px"'+(o.pend ? ' title="승인 대기"' : '')+'>'+
    '<i class="tp-h l" title="시작 시간"></i><b class="tp-lab">'+hm(a)+'~'+hm(b)+'</b><i class="tp-h r" title="끝 시간"></i></span>';
}
var tpDrag = null;
function tpMin(x, rect){ var m = TP_A + (x - rect.left) / rect.width * (TP_B - TP_A); return Math.round(m / 10) * 10; }
function tpRowAt(bar, y){   // 화면 높이 → 날짜 줄 (매번 줄은 0)
  var best = null;
  [].forEach.call(bar.querySelectorAll('.tp-day'), function(el){
    var r = el.getBoundingClientRect();
    if (y >= r.top && y < r.bottom) best = el;
  });
  return best;
}
function tpShow(){

}
function drawMine(bar, el, a, b, d){

  el.querySelector('.tp-lab').textContent = hm(a) + '~' + hm(b);
  var days = d ? [d] : (bar.dataset.days || '').split(',').map(Number);
  var bad = [].some.call(bar.querySelectorAll('.tp-seg'), function(x){ return days.indexOf(+x.dataset.d) >= 0 && +x.dataset.s < b && a < +x.dataset.e; });
  el.classList.toggle('bad', bad);

}
/* 이용시간 칸에 글자로 적는 동안에도 '매번' 네모가 따라 움직인다 (저장은 칸을 나갈 때) */
document.getElementById('main').addEventListener('input', function(e){
  var el = e.target, key = el.dataset && el.dataset.key;
  if (!key || !/:time$/.test(key)) return;
  var bar = document.querySelector('.tp-busy[data-row="' + key.replace(/:time$/, '') + '"]'); if (!bar) return;
  var t = parseTime(el.value), mine = bar.querySelector('.tp-mine.all');
  if (!t) { if (mine) mine.style.display = 'none'; return; }
  if (!mine) { bar.insertAdjacentHTML('beforeend', mineHTML(t.s, t.e)); mine = bar.querySelector('.tp-mine.all'); }
  mine.style.display = '';

});
document.getElementById('main').addEventListener('pointerdown', function(e){
  var bar = e.target.closest('.tp-busy'); if (!bar || e.button > 0) return;
  e.preventDefault();
  var rect = bar.getBoundingClientRect(), m = tpMin(e.clientX, rect), mine = e.target.closest('.tp-mine');
  var mode = e.target.closest('.tp-h.l') ? 'l' : e.target.closest('.tp-h.r') ? 'r' : mine ? 'move' : 'draw';
  var g = {bar:bar, rect:rect, mode:mode, m0:m};
  if (!mine) {   // 빈 곳: 매번 줄이면 시간 정하기, 날짜 줄이면 그날 하루 더하기
    var row = tpRowAt(bar, e.clientY); if (!row) return;
    var d = +row.dataset.d;
    if (d && bar.dataset.row.indexOf('b:') === 0) return;   // 아직 없는 줄: 먼저 매번 시간부터
    bar.insertAdjacentHTML('beforeend', mineHTML(m, m + 60, false, d ? {kind:'new', d:d, top:parseFloat(row.style.top), h:parseFloat(row.style.height)} : null));
    mine = bar.lastElementChild;
  }
  g.mine = mine; g.kind = mine.dataset.kind; g.id = mine.dataset.id; g.d0 = g.d = +mine.dataset.d;
  g.s0 = +mine.dataset.s; g.e0 = +mine.dataset.e;
  g.s = mode === 'draw' ? Math.min(m, TP_B - 60) : g.s0;
  g.e = mode === 'draw' ? g.s + 60 : g.e0;
  tpDrag = g;
  mine.classList.add('drag');
  try { bar.setPointerCapture(e.pointerId); } catch(err) {}
  tpShow();
});
document.getElementById('main').addEventListener('pointermove', function(e){
  var g = tpDrag; if (!g) return;
  var m = Math.max(TP_A, Math.min(TP_B, tpMin(e.clientX, g.rect)));
  if (g.mode === 'move') {
    var len = g.e0 - g.s0; g.s = Math.max(TP_A, Math.min(TP_B - len, g.s0 + m - g.m0)); g.e = g.s + len;
    if (g.kind !== 'all') {   // 날짜 줄의 네모는 위아래로 다른 날짜 줄에
      var row = tpRowAt(g.bar, e.clientY);
      if (row && +row.dataset.d) { g.d = +row.dataset.d; g.dayEl = row; }
    }
  }
  else if (g.mode === 'l') { g.s = Math.min(m, g.e0 - 10); g.e = g.e0; }
  else if (g.mode === 'r') { g.e = Math.max(m, g.s0 + 10); g.s = g.s0; }
  else if (Math.abs(m - g.m0) >= 10) { g.s = Math.min(m, g.m0); g.e = Math.max(m, g.m0); }
  tpShow();
});
function tpEnd(){
  var g = tpDrag; if (!g) return; tpDrag = null;
  var val = hm(g.s) + '~' + hm(g.e), rid = g.bar.dataset.row;
  if (g.kind === 'all') return setTime(rid, val);
  if (g.kind !== 'new' && g.d === g.d0 && g.s === g.s0 && g.e === g.e0) return render();

}

/* 시간을 정해 저장 (빈 줄이면 새 줄이 생기고 고르는 칸은 그 줄로) */
function setTime(rid, val){
  var row = rowFor(rid, true); if (!row) return;
  if (rid.indexOf('b:') === 0) { row.time = val; remap = {from:rid+':', to:'r:'+row.id+':'}; openTime = 'r:'+row.id; }
  else updateRow(row, function(x){ x.time = val; });
  save(); render();
}
/* 그날만 옮기기 (현황표에서 그날만 고치는 것과 같음): 원래 날은 빼고, 새 날에 하루짜리 칸.
   kind 'row' = 신청서 줄 그대로인 날, 'op' = 이미 그날만 옮긴 칸, 'new' = 하루 더하기 */
function moveDay(rid, kind, id, d0, d, s, e){
  var row = rowFor(rid); if (!row) return;
  var mo = M(), conf = needsApproval();
  if (kind === 'row') mo.ops.push({id:uid(), type:'remove', rowId:row.id, d:d0, pend: conf ? {kind:'new'} : null});
  var from = kind === 'row' ? d0 : null;
  if (kind === 'op') {
    var o = mo.ops.find(function(x){ return x.id === id; }); if (!o) return;
    from = o.blk && o.blk.from || null;
    if (!conf || (o.pend && o.pend.kind === 'new')) mo.ops.splice(mo.ops.indexOf(o), 1);
    else o.pend = {kind:'del', prev: o.pend ? o.pend.prev : o.blk};
  }
  mo.ops.push({id:uid(), type:'add', d:d, pend: conf ? {kind:'new'} : null,
    blk:{dept:row.dept, prog:row.prog, time:hm(s)+'~'+hm(e), note:row.note||'', half: s >= 720 ? 'pm' : 'am', rowId:row.id, from:from}});
  save(); render();
}
function timePick(b){
  var rid = b.dataset.row, row = rowFor(rid, true); if (!row) return;
  var t = parseTime(row.time), k = b.dataset.k, v = +b.dataset.v;
  var st = t ? {sh:Math.floor(t.s/60), sm:t.s%60, eh:Math.floor(t.e/60), em:t.e%60} : {sh:null, sm:0, eh:null, em:0};
  st[k] = v;
  if (st.sh == null) st.sh = Math.max(8, (st.eh != null ? st.eh : 10) - 1);
  var a = st.sh*60 + st.sm;
  if (k.charAt(0) === 's' && (st.eh == null || st.eh*60 + st.em <= a)) { st.eh = st.sh + 1; st.em = st.sm; }
  if (st.eh*60 + st.em <= a) { st.sh = st.eh - 1; st.sm = st.em; }
  setTime(rid, pad(st.sh)+':'+pad(st.sm)+'~'+pad(st.eh)+':'+pad(st.em));
  var f = document.querySelector('[data-act="tp"][data-row="'+openTime+'"][data-k="'+k+'"][data-v="'+v+'"]'); if (f) f.focus();
}

/* 이 줄에서 그날만 바꾼 것 (현황표에서 고친 칸, 시간 막대에서 옮긴 칸) → 신청서 이용날짜 아래에 */
function rowDayNotes(r, mode){
  var scr = mode === 'screen', out = [], moved = {}, wd = function(d){ return d+'일('+'일월화수목금토'[dow(d)]+')'; };
  var tag = function(o){ return scr && o.pend ? ' (승인 대기)' : ''; };
  var live = function(o){ return scr ? !(o.pend && o.pend.kind === 'del') : !o.pend; };   // 인쇄는 승인된 것만
  M().ops.forEach(function(o){
    if (o.type !== 'add' || !o.blk || o.blk.rowId !== r.id || !live(o)) return;
    var t = parseTime(o.blk.time), tm = t ? t.label : o.blk.time, f = o.blk.from;
    if (f) moved[f] = true;
    out.push({d:o.d, text: !f ? '+ '+wd(o.d)+' '+tm : f === o.d ? f+'일만 '+tm : f+'일 → '+wd(o.d)+' '+tm, tag:tag(o)});
  });
  M().ops.forEach(function(o){
    if (o.type !== 'remove' || o.rowId !== r.id || !live(o) || moved[o.d]) return;
    out.push({d:o.d, text:o.d+'일 빠짐', tag:tag(o)});

  return out.sort(function(a,b){ return a.d - b.d; }).map(function(x){ return x.text + x.tag; });

function parseBlock(text, forced){
  var lines = String(text||'').split(/\n/).map(function(s){ return s.trim(); }).filter(Boolean);
  if (!lines.length) return null;
  var time = '', other = [], notes = [];
  lines.forEach(function(l){
    if (/^[*＊※]/.test(l)) { notes.push(l.replace(/^[*＊※]\s*/, '')); return; }   // *로 시작하는 줄 = 기타
    var t = parseTime(l); if (!time && t) time = t.label; else other.push(l);
  });
  var clean = function(s){ return (s||'').replace(/^[<〈《(]\s*/,'').replace(/\s*[>〉》)]$/,''); };
  var note = notes.filter(Boolean).join(' / ');
  if (forced) { other = other.filter(function(l){ return l !== forced; }); return {dept:forced, prog:clean(other[0]), time:time, note:note}; }
  return {dept: other[0]||'', prog: clean(other[1]), time: time, note: note};
}

  if (el.dataset.dk === 'admin') {
    if (v.length >= 4) send(function(){ return api('PUT', '/settings', {adminPin:v}); }, function(r){ if (r.token) adminToken = r.token; el.value = ''; });
    return;
  }
  var p = el.dataset.dk.split(':'), i = +p[0], f = p[1], d = DB.depts[i];
  if (!d) {
    if (f !== 'name' || !v || deptOf(v)) return commit();
    var used = DB.depts.map(function(x){ return x.ci; }), ci = 0; while (used.indexOf(ci) >= 0) ci++;
    DB.depts.push({name:v, hasPin:false, ci:ci});
    put({action:'add', name:v});
    return commit();
  }
  if (f === 'mgr') { if (v !== (d.manager || '')) { d.manager = v; put({action:'manager', name:d.name, manager:v}, function(){}); } return commit(); }
  if (f === 'pin') { if (v) { d.hasPin = true; put({action:'pin', name:d.name, pin:v}); } return commit(); }
  if (!v) { DB.depts.splice(i,1); if (DB.me === d.name) DB.me = null; put({action:'remove', name:d.name}); }
  else if (v !== d.name && !deptOf(v)) { if (DB.me === d.name) DB.me = v; put({action:'rename', name:d.name, to:v}); d.name = v; }
  commit();
}

/* ---------------- 버튼 ---------------- */
function goPending(){
  var mo = M();
  var inCal = mo.ops.some(function(o){ return o.pend; }) || mo.rows.some(function(r){ return r.pend && r.pend.kind !== 'del'; });
  view = inCal ? 'cal' : 'form'; save(); render();
  var el = document.querySelector(view === 'cal' ? '#sheet .blk.pd' : '#sheet tr.pdrow');
  if (el) { el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 2600); }
}
document.addEventListener('click', function(e){
  if (askFn && !e.target.closest('#ask')) closeAsk();
  if (mp && !e.target.closest('.mpick') && !e.target.closest('[data-act="mp"]')) { mp = null; render(); }
  var b = e.target.closest('button[data-act]');
  if (openPick && !e.target.closest('.pickrow') && !(b && b.dataset.act === 'pick')) { openPick = null; if (!b) return render(); }
  if (openTime && !e.target.closest('.pickrow') && !(e.target.dataset && /:time$/.test(e.target.dataset.key || ''))) { openTime = null; if (!b) return render(); }
  if (!b) return;
  var act = b.dataset.act, mo = M(), m = ym().m;
  switch (act) {
    case 'pick': if (pickJustOpened) { pickJustOpened = false; return; } openPick = openPick === b.dataset.row ? null : b.dataset.row; return render();
    case 'pkWd': case 'pkDay': return pickAction(b);
    case 'pkClose': openPick = null; return render();
    case 'tp': return timePick(b);
    case 'tpClose':
      openTime = null; render();
      var nt = document.querySelector('[data-key="'+b.dataset.row+':note"]'); if (nt) nt.focus();
      return;
    case 'tchip':
      var tr = rowFor(b.dataset.row, true); if (!tr) return;
      if (b.dataset.row.indexOf('b:') === 0) { tr.time = b.dataset.v; remap = {from:b.dataset.row+':', to:'r:'+tr.id+':'}; }
      else updateRow(tr, function(x){ x.time = b.dataset.v; });
      openTime = null;
      save(); render();
      var nx = document.querySelector('[data-key="r:'+tr.id+':note"]'); if (nx) nx.focus();
      return;
    case 'dchip':
      var dr2 = rowFor(b.dataset.row, true); if (!dr2) return;
      if (b.dataset.row.indexOf('b:') === 0) { dr2.dept = b.dataset.v; remap = {from:b.dataset.row+':', to:'r:'+dr2.id+':'}; }
      else updateRow(dr2, function(x){ x.dept = b.dataset.v; });
      save(); render();
      var nx2 = document.querySelector('[data-key="r:'+dr2.id+':prog"]'); if (nx2) nx2.focus();
      return;
    case 'delRow':
      var dr = rowFor(b.dataset.row); if (!dr) return;
      return ask({text: '"'+(dr.prog || '이름 없는 일정')+'" 줄을 지울까요?'+(needsApproval() ? ' 확정된 달이라 관리자가 승인하면 지워져요.' : ''), okLabel:'지우기', danger:true, at:b,
        onOk:function(){ updateRow(dr, function(x){ x.person = ''; x.prog = ''; x.time = ''; x.note = ''; x.sel = emptySel(); }); }});
    case 'delBlk':
      var be = document.querySelector('.blk[data-key="'+b.dataset.key+'"]'); if (!be) return;
      return ask({text: m+'월 '+be.dataset.d+'일 이 일정만 뺄까요? 다른 날은 그대로예요.'+(needsApproval() ? ' 관리자가 승인하면 빠져요.' : ''), okLabel:'이날만 빼기', danger:true, at:b,
        onOk:function(){ var el2 = document.querySelector('.blk[data-key="'+b.dataset.key+'"]'); if (el2) applyBlock(el2, ''); }});
    case 'prev': case 'next': return goMonth(shiftMonth(cur, act === 'prev' ? -1 : 1));
    case 'mp': mp = mp ? null : {y: ym().y}; return render();
    case 'pw':
      var pwN = weeksOf().length, pwI = (phoneWeek[cur] || 0) + (+b.dataset.v);
      if (pwI < 0) { var pk = shiftMonth(cur, -1); phoneWeek[pk] = 99; return goMonth(pk); }      // 지난달 마지막 주로
      if (pwI >= pwN) { var nk = shiftMonth(cur, 1); phoneWeek[nk] = 0; return goMonth(nk); }     // 다음 달 1주로
      phoneWeek[cur] = pwI; return render();
    case 'mpY': mp.y += +b.dataset.v; return render();
    case 'mpGo': return goMonth(b.dataset.v);
    case 'view': view = b.dataset.v; return commit();
    case 'print': preparePrint(); return setTimeout(function(){ window.print(); }, 60);
    case 'pend': return goPending();
    case 'hideNotice': mo.imported = null; return commit();
    case 'approve': case 'reject':
      if (!admin) return;
      decide(b.dataset.src, b.dataset.id, act === 'approve'); markSynced();
      sendMonth('/approve', {kind: b.dataset.src === 'row' ? 'row' : 'op', id: b.dataset.id, ok: act === 'approve'});
      return commit();
    case 'switchDept': DB.me = null; deptToken = null; return commit();
    case 'adminExit': admin = false; adminToken = null; if (location.hash) history.replaceState(null, '', location.pathname + location.search); if (view === 'dept') view = 'cal'; return commit();
    case 'pickDept':
      var d = deptOf(b.dataset.name); if (!d) return;
      var deptLogin = function(v){ return api('POST', '/login', {dept:d.name, pin:v}).then(function(r){ deptToken = r.token; return null; }, function(e){ return e.message; }); };
      if (!d.hasPin) return deptLogin('').then(function(err){ if (err) return ask({text:err, okLabel:'확인', onOk:function(){}}); DB.me = d.name; commit(); });
      return ask({text: d.name+' 비밀번호를 적어 주세요.', pin:true, okLabel:'들어가기', check:deptLogin, at:b, below:true,
        onOk:function(){ DB.me = d.name; }});
    case 'adminEnter': return adminLogin(b);
    case 'clearPin':
      var cd = DB.depts[+b.dataset.i]; if (!admin || !cd) return;
      return ask({text: cd.name+' 비밀번호를 없앨까요? 누구나 들어갈 수 있게 돼요.', okLabel:'없애기', danger:true, at:b,
        onOk:function(){ cd.hasPin = false; send(function(){ return api('PUT', '/depts', {action:'pin', name:cd.name, pin:''}); }); }});
  }
});
function adminLogin(at){
      if (admin) return;
      var first = !DB.adminSet;
      ask({text: first ? '처음이라 관리자 비밀번호를 정해 주세요 (4자리 이상).' : '관리자 비밀번호를 적어 주세요.', pin:true, okLabel:'들어가기', at:at, below:true,
        check: adminCheck(first), onOk:function(){ DB.adminSet = true; admin = true; }});
}
function adminCheck(first){
  return function(v){
    if (first && v.length < 4) return '4자리 이상으로 정해 주세요.';
    return api('POST', '/login', {admin:true, pin:v}).then(function(r){ adminToken = r.token; return null; }, function(e){ return e.message; });
  };
}
document.addEventListener('click', function(e){
  var b = e.target.closest('button[data-act]'); if (!b) return;
  var act = b.dataset.act, mo = M(), m = ym().m;
  switch (act) {
    case 'confirm':
      if (!mo.confirmed) return ask({text: m+'월을 확정할까요? 확정한 뒤 각 부서가 새로 적거나 고친 일정은 승인 대기로 들어가요.', okLabel:'확정', onOk:function(){ if (admin) { mo.confirmed = true; markSynced(); sendMonth('/month/confirm', {ym:cur, confirmed:true}); } }});
      return ask({text: m+'월 확정을 풀까요? 풀면 각 부서가 바로 고칠 수 있어요.', okLabel:'확정 풀기', onOk:function(){ if (admin) { mo.confirmed = false; markSynced(); sendMonth('/month/confirm', {ym:cur, confirmed:false}); } }});
    case 'clearMonth':
      return ask({text: m+'월 신청서와 현황표를 모두 지울까요? 다른 달은 그대로 두고, 지운 내용은 되돌릴 수 없어요.', okLabel: m+'월 지우기', danger:true, at:b,
        onOk:function(){ if (admin) { DB.months[cur] = {confirmed:false, ops:[], rows:[], imported:null, period:M().period}; markSynced(); sendMonth('/month/clear', {ym:cur}); } }});
  }
});


/* ---------------- 인쇄: A4 한 장에 맞추고, 너무 작아지면 두 장 ---------------- */
var A4W = 715, A4H = 950;
function preparePrint(){
  var area = document.getElementById('printArea');
  var page = function(inner){ return '<div class="ppage pp"><div class="sheet">'+inner+'</div></div>'; };
  area.style.cssText = 'display:block;position:absolute;left:-10000px;top:0;width:940px';
  if (view === 'form') {
    area.innerHTML = page(formHTML('print'));
  } else {
    area.innerHTML = page(calHTML('print'));
    if (A4H / area.firstChild.offsetHeight < 0.62) {
      var n = weeksOf().length, cut = Math.ceil(n/2);
      area.innerHTML = page(calHTML('print',[0,cut])) + page(calHTML('print',[cut,n]));
    }
  }
  var pages = area.querySelectorAll('.ppage'), z = 1;
  pages.forEach(function(p){ z = Math.min(z, A4W / p.offsetWidth, A4H / p.offsetHeight); });
  area.style.cssText = '';
  pages.forEach(function(p){ p.style.zoom = z; });
}
window.addEventListener('beforeprint', function(){ if (document.getElementById('sheet') && document.getElementById('sheet').dataset.view !== 'choose') preparePrint(); });

/* ---------------- 시작 ---------------- */
function checkHash(){ if (/^#(admin|관리자)$/.test(decodeURIComponent(location.hash))) adminLogin(); }
function loadFailed(e){
  if (M()) return ask({text: '불러오지 못했어요. ' + (e && e.message ? e.message : ''), okLabel:'확인', onOk:function(){}});
  document.getElementById('main').innerHTML = '<section class="sheet chooser"><p>불러오지 못했어요. ' + esc(e && e.message ? e.message : '') + ' 잠시 뒤 새로고침해 주세요.</p></section>';
}
/* 설치(PWA): 크롬·엣지 주소창의 '설치', 휴대폰은 '홈 화면에 추가' */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});
loadPrefs();
loadMonth(cur).then(function(){ render(); window.addEventListener('hashchange', checkHash); checkHash(); }, loadFailed);
</script>
